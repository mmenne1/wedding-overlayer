<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wedding Overlayer by Marcel Menne Fotografie</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#272421;--muted:#827970;--cream:#f7f2eb;--paper:#fffdfa;--line:#e6ddd3;--sage:#687a6a;--rose:#d6a49a;--shadow:0 18px 50px #40352b13}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font:14px 'DM Sans',sans-serif}button,input,textarea{font:inherit}button{cursor:pointer}a{color:inherit}.topbar{height:78px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 5vw;background:#f9f5f0}.brand{font:600 26px 'Cormorant Garamond';letter-spacing:.06em;color:var(--sage)}.brand small{font:11px 'DM Sans';font-weight:500;letter-spacing:.13em;color:var(--muted);margin-left:11px;text-transform:uppercase}.top-actions{display:flex;align-items:center;gap:18px}.top-actions button,.quiet{border:0;background:none;color:var(--muted);font-size:12px}.avatar{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--rose);color:white;font-size:12px}.wrap{max-width:1180px;margin:auto;padding:52px 5vw}.eyebrow{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--sage);font-weight:600}.dash-title{font:500 59px/.86 'Cormorant Garamond';margin:18px 0 14px;letter-spacing:-.03em}.lead{color:var(--muted);line-height:1.7;max-width:510px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:36px 0}.stat{background:var(--paper);border:1px solid var(--line);border-radius:5px;padding:20px 23px}.stat b{font:500 34px 'Cormorant Garamond';display:block}.stat span{font-size:11px;color:var(--muted)}.bar{display:flex;align-items:center;justify-content:space-between;margin:42px 0 18px}.bar h2{font:500 38px 'Cormorant Garamond';margin:0}.btn{border:1px solid var(--line);border-radius:99px;padding:12px 18px;background:transparent;font-size:11px;letter-spacing:.07em;text-transform:uppercase}.btn.primary{background:var(--sage);border-color:var(--sage);color:#fff}.pages{display:grid;grid-template-columns:repeat(3,1fr);gap:17px}.page-card{background:var(--paper);border:1px solid var(--line);border-radius:5px;overflow:hidden;box-shadow:0 4px 18px #44372b08}.page-cover{height:186px;background-size:cover;background-position:center;position:relative}.page-status{position:absolute;top:14px;left:14px;padding:6px 9px;border-radius:99px;background:#fffdfad9;color:var(--sage);font-size:10px}.page-info{padding:18px 19px}.page-info h3{font:500 27px 'Cormorant Garamond';margin:0 0 5px}.page-info p{font-size:11px;color:var(--muted);margin:0 0 16px}.page-foot{border-top:1px solid var(--line);padding-top:13px;display:flex;justify-content:space-between;align-items:center}.page-foot .url{font-size:10px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:135px}.page-foot button{border:0;background:none;color:var(--sage);font-size:11px}.empty{text-align:center;padding:68px 20px;border:1px dashed #d7c9bd;border-radius:5px;grid-column:1/-1}.empty h3{font:500 32px 'Cormorant Garamond';margin:0 0 8px}.empty p{color:var(--muted);font-size:12px}.modal{position:fixed;inset:0;background:#27211dd9;display:none;align-items:center;justify-content:center;padding:22px;z-index:20}.modal.open{display:flex}.dialog{background:var(--paper);width:min(680px,100%);max-height:93vh;overflow:auto;border-radius:7px;padding:35px;box-shadow:var(--shadow)}.dialog-head{display:flex;justify-content:space-between;align-items:start}.dialog h2{font:500 42px 'Cormorant Garamond';margin:0 0 7px}.dialog .sub{color:var(--muted);font-size:12px;line-height:1.6;margin:0 0 28px}.x{border:0;background:none;color:var(--muted);font-size:25px}.field{margin:16px 0}.field label{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:7px}.field input,.field textarea{width:100%;border:1px solid var(--line);border-radius:4px;background:white;padding:13px 14px;color:var(--ink);outline:none}.field input:focus,.field textarea:focus{border-color:var(--sage)}.field textarea{min-height:70px;resize:vertical}.hint{font-size:10px;color:var(--muted);margin-top:7px;line-height:1.5}.cats{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}.cat{display:flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:99px;padding:6px 9px 6px 12px;background:white;font-size:11px}.cat button{border:0;background:none;color:var(--muted);padding:0;font-size:15px;line-height:1}.add-cat{display:flex;gap:7px;margin-top:9px}.add-cat input{padding:9px;border:1px solid var(--line);border-radius:3px;flex:1}.dialog-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:28px}.notice{background:#edf2eb;color:#566858;padding:12px;border-radius:4px;font-size:11px;line-height:1.5;margin-top:18px}.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%) translateY(20px);background:#272421;color:#fff;padding:13px 18px;border-radius:99px;font-size:11px;opacity:0;transition:.25s;z-index:50}.toast.show{opacity:1;transform:translateX(-50%)}
/* public gallery */.public{min-height:100vh}.public .public-nav{height:78px;padding:0 5vw;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line)}.public .public-nav .btn{font-size:10px}.public .hero{max-width:1180px;margin:auto;min-height:580px;padding:65px 5vw;display:grid;grid-template-columns:1fr 1.1fr;align-items:center;gap:45px}.public h1{font:500 clamp(65px,8vw,112px)/.82 'Cormorant Garamond';margin:22px 0 28px;letter-spacing:-.05em}.public h1 em{color:var(--rose);font-style:normal}.public .hero p{max-width:375px;color:var(--muted);line-height:1.8;font-size:13px}.hero-image{height:495px;position:relative}.hero-image img{width:76%;height:100%;margin-left:auto;display:block;object-fit:cover;border-radius:190px 190px 9px 9px;filter:saturate(.76)}.seal{position:absolute;bottom:35px;left:2%;width:103px;height:103px;display:grid;place-items:center;text-align:center;border-radius:50%;background:var(--paper);color:var(--sage);font:600 13px/1 'Cormorant Garamond';transform:rotate(-13deg);box-shadow:var(--shadow)}.public .content{max-width:1180px;padding:20px 5vw 95px;margin:auto}.public .section-head{border-top:1px solid var(--line);padding-top:40px;display:flex;justify-content:space-between;align-items:end;margin-bottom:25px}.public h2{font:500 52px/.9 'Cormorant Garamond';margin:0}.public .section-head p{font-size:11px;color:var(--muted);line-height:1.6}.filters{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}.filters button{border:1px solid var(--line);background:transparent;color:var(--muted);padding:9px 14px;border-radius:99px;font-size:10px}.filters button.active{background:var(--ink);color:#fff;border-color:var(--ink)}.photo-grid{columns:3 220px;column-gap:13px}.photo-grid button{padding:0;border:0;width:100%;margin:0 0 13px;display:block;break-inside:avoid;position:relative;overflow:hidden;background:#ddd}.photo-grid img{display:block;width:100%;transition:.5s}.photo-grid button:hover img{transform:scale(1.03)}.photo-grid span{position:absolute;bottom:11px;left:12px;color:white;font-size:10px;text-shadow:0 1px 6px #000;opacity:0}.photo-grid button:hover span{opacity:1}.public-footer{background:var(--sage);color:white;padding:60px 5vw 25px;display:flex;justify-content:space-between;align-items:end}.public-footer h2{font-size:54px}.public-footer p{max-width:270px;color:#eef2ecb8;font-size:11px;line-height:1.7}.lightbox{position:fixed;inset:0;background:#1c1917ed;z-index:30;display:none;place-items:center;padding:25px}.lightbox.open{display:grid}.lightbox img{max-width:90vw;max-height:87vh}.lightbox .x{position:fixed;right:25px;top:17px;color:#fff;font-size:30px}.lightbox figcaption{position:fixed;bottom:19px;color:#fff;font-size:10px;letter-spacing:.12em;text-transform:uppercase}
@media(max-width:760px){.topbar{padding:0 20px}.brand small{display:none}.top-actions .quiet{display:none}.wrap{padding:38px 20px}.dash-title{font-size:52px}.stats{gap:7px}.stat{padding:15px}.stat b{font-size:27px}.pages{grid-template-columns:1fr}.dialog{padding:25px}.public .hero{display:block;padding:58px 20px 35px}.public .hero p{font-size:12px}.hero-image{height:390px;margin-top:50px}.hero-image img{width:84%}.public .content{padding:25px 20px 65px}.public .section-head{display:block}.public .section-head p{margin-top:15px}.public-footer{display:block;padding:50px 20px 25px}.public-footer h2{font-size:48px}}
</style></head>
<body><div id="app"></div><div class="toast" id="toast"></div>
<script>
const DEMO_PHOTOS=[['https://images.unsplash.com/photo-1511285560929-80b456fea0bc?auto=format&fit=crop&w=900&q=85','Before the wedding','Quiet morning'],['https://images.unsplash.com/photo-1523438885200-e635ba2c371e?auto=format&fit=crop&w=900&q=85','Before the wedding','Getting ready'],['https://images.unsplash.com/photo-1507504031003-b417219a0fde?auto=format&fit=crop&w=900&q=85','The party','A toast to forever'],['https://images.unsplash.com/photo-1519225421980-715cb0215aed?auto=format&fit=crop&w=900&q=85','The ceremony','Just married'],['https://images.unsplash.com/photo-1544078751-58fee2d8a03b?auto=format&fit=crop&w=900&q=85','The party','Dancing all night'],['https://images.unsplash.com/photo-1519741497674-611481863552?auto=format&fit=crop&w=900&q=85','The ceremony','Our favourite people'],['https://images.unsplash.com/photo-1478146896981-b80fe463b330?auto=format&fit=crop&w=900&q=85','Before the wedding','The little details'],['https://images.unsplash.com/photo-1507504031003-b417219a0fde?auto=format&fit=crop&w=900&q=85','The party','The last dance']];
const STORE='gather-gallery-pages';let pages=JSON.parse(localStorage.getItem(STORE)||'null')||[{id:'amelia-noah',name:'Amelia & Noah',date:'18 · 06 · 2024',location:'Tuscany',drive:'https://drive.google.com/drive/folders/your-folder-id',description:'A little collection of the moments that made our wedding day feel like a dream.',categories:['Before the wedding','The ceremony','The party'],photos:DEMO_PHOTOS}];
function save(){localStorage.setItem(STORE,JSON.stringify(pages))}function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function toast(s){let t=document.querySelector('#toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2600)}
function newId(name){return (name.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'gallery')+'-'+Math.random().toString(36).slice(2,7)}function publicUrl(id){return location.href.split('?')[0]+'?page='+encodeURIComponent(id)}
function admin(){document.title='Gather · Gallery studio';document.querySelector('#app').innerHTML=`<header class="topbar"><div class="brand">gather <small>gallery studio</small></div><div class="top-actions"><button class="quiet" onclick="showHelp()">How it works</button><div class="avatar">G</div></div></header><main class="wrap"><div class="eyebrow">Your workspace</div><h1 class="dash-title">Beautiful galleries,<br><i>made simple.</i></h1><p class="lead">Create a private, story-led home for every wedding. Connect the original Drive folder, curate the chapters, and send one elegant link to your couple.</p><div class="stats"><div class="stat"><b>${pages.length}</b><span>active galleries</span></div><div class="stat"><b>${pages.reduce((a,p)=>a+(p.photos?.length||0),0)}</b><span>curated photographs</span></div><div class="stat"><b>∞</b><span>memories to share</span></div></div><div class="bar"><h2>Your galleries</h2><button class="btn primary" onclick="openCreate()">＋ Create gallery</button></div><div class="pages">${pages.length?pages.map(card).join(''):`<div class="empty"><h3>Your first gallery starts here</h3><p>Connect a Drive folder and turn a collection of photos into an experience.</p><button class="btn primary" onclick="openCreate()">Create a gallery</button></div>`}</div></main>`}
function card(p){return `<article class="page-card"><div class="page-cover" style="background-image:url('${p.photos?.[0]?.[0]||DEMO_PHOTOS[0][0]}')"><span class="page-status">● Published</span></div><div class="page-info"><h3>${esc(p.name)}</h3><p>${esc(p.date)} · ${esc(p.location)} · ${p.photos?.length||0} photos</p><div class="page-foot"><span class="url">${publicUrl(p.id).replace(location.origin,'')}</span><button onclick="copyUrl('${p.id}')">Copy link ↗</button><button onclick="openPage('${p.id}')">View</button></div></div></article>`}
function openCreate(){document.querySelector('#app').insertAdjacentHTML('beforeend',`<div class="modal open" id="editor"><div class="dialog"><div class="dialog-head"><div><div class="eyebrow">New customer page</div><h2>Create a gallery</h2><p class="sub">Add the basics now. You can refine the story and categories before sending the link.</p></div><button class="x" onclick="closeEditor()">×</button></div><form onsubmit="createPage(event)"><div class="field"><label>Couple / gallery name</label><input required name="name" placeholder="Amelia & Noah"></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:12px"><div class="field"><label>Date</label><input name="date" placeholder="18 · 06 · 2024"></div><div class="field"><label>Location</label><input name="location" placeholder="Tuscany"></div></div><div class="field"><label>Google Drive folder link</label><input required type="url" name="drive" placeholder="https://drive.google.com/drive/folders/..." ><div class="hint">The folder should be shared as “Anyone with the link”. It remains the original download archive.</div></div><div class="field"><label>Welcome note</label><textarea name="description" placeholder="A little collection of the moments..."></textarea></div><div class="field"><label>Story chapters</label><div class="cats" id="cats"><span class="cat">Before the wedding <button type="button" onclick="removeCat(this)">×</button></span><span class="cat">The ceremony <button type="button" onclick="removeCat(this)">×</button></span><span class="cat">The party <button type="button" onclick="removeCat(this)">×</button></span></div><div class="add-cat"><input id="catInput" placeholder="Add a chapter"><button type="button" class="btn" onclick="addCat()">Add</button></div></div><div class="notice">Demo mode is ready with sample photographs. Connect the Google Drive API to automatically read, classify and thumbnail the real files.</div><div class="dialog-actions"><button type="button" class="btn" onclick="closeEditor()">Cancel</button><button class="btn primary">Create private page</button></div></form></div></div>`)}
function removeCat(b){b.parentElement.remove()}function addCat(){let i=document.querySelector('#catInput'),v=i.value.trim();if(v){document.querySelector('#cats').insertAdjacentHTML('beforeend',`<span class="cat">${esc(v)} <button type="button" onclick="removeCat(this)">×</button></span>`);i.value=''}}function closeEditor(){document.querySelector('#editor')?.remove()}
function createPage(e){e.preventDefault();let f=new FormData(e.target),cats=[...document.querySelectorAll('#cats .cat')].map(x=>x.childNodes[0].textContent.trim());let p={id:newId(f.get('name')),name:f.get('name'),date:f.get('date')||'',location:f.get('location')||'',drive:f.get('drive'),description:f.get('description')||'A collection of the moments that made this day unforgettable.',categories:cats.length?cats:['The day'],photos:DEMO_PHOTOS.map(x=>cats.includes(x[1])?x:[x[0],cats[0]||x[1],x[2]])};pages.unshift(p);save();closeEditor();admin();toast('Gallery created — your private link is ready')}
function copyUrl(id){navigator.clipboard?.writeText(publicUrl(id));toast('Private customer link copied')}
function openPage(id){location.href=publicUrl(id)}function showHelp(){alert('Create a gallery, paste the customer’s Drive folder link, and copy the generated private URL. Each customer page only shows its own gallery and has no workspace navigation.')}
function customer(p){document.title=p.name+' · photographs';document.querySelector('#app').innerHTML=`<div class="public"><nav class="public-nav"><div class="brand">${esc(p.name)}</div><button class="btn" onclick="window.open('${esc(p.drive)}','_blank')">Open original Drive ↗</button></nav><section class="hero"><div><div class="eyebrow">${esc(p.date)} &nbsp; / &nbsp; ${esc(p.location)}</div><h1>Your day,<br>in <em>photographs.</em></h1><p>${esc(p.description)}</p><div style="margin-top:28px"><button class="btn primary" onclick="document.querySelector('#collection').scrollIntoView({behavior:'smooth'})">Explore the day ↓</button></div></div><div class="hero-image"><img src="${p.photos?.[0]?.[0]||DEMO_PHOTOS[0][0]}" alt="Wedding photograph"><div class="seal">made with<br>love<br>✦</div></div></section><section class="content" id="collection"><div class="section-head"><div><div class="eyebrow">The complete collection</div><h2>Every little moment</h2></div><p>Tap any photograph to view it larger.</p></div><div class="filters" id="filters"><button class="active" onclick="renderPhotos('All',this)">All moments</button>${p.categories.map(c=>`<button onclick="renderPhotos('${esc(c)}',this)">${esc(c)}</button>`).join('')}</div><div class="photo-grid" id="photoGrid"></div></section><footer class="public-footer"><div><div class="eyebrow" style="color:#d7e0d5">Want to see everything?</div><h2>Download the<br>full gallery.</h2><button class="btn" style="background:#f5f1ea;color:var(--sage)" onclick="window.open('${esc(p.drive)}','_blank')">Open Google Drive ↗</button></div><p>Your high-resolution originals are safely stored in the Google Drive folder. Feel free to download and share your favourites.</p></footer></div><div class="lightbox" id="lightbox" onclick="closeLight(event)"><button class="x">×</button><img id="big" alt=""><figcaption id="caption"></figcaption></div>`;window.currentPage=p;renderPhotos('All',document.querySelector('.filters button'))}
function renderPhotos(cat,el){document.querySelectorAll('.filters button').forEach(x=>x.classList.remove('active'));el.classList.add('active');let list=cat==='All'?currentPage.photos:currentPage.photos.filter(x=>x[1]===cat);document.querySelector('#photoGrid').innerHTML=list.map(x=>`<button onclick="light('${x[0]}','${esc(x[2])}')"><img src="${x[0]}" alt="${esc(x[2])}" loading="lazy"><span>${esc(x[2])}</span></button>`).join('')}
function light(src,caption){document.querySelector('#big').src=src;document.querySelector('#caption').textContent=caption;document.querySelector('#lightbox').classList.add('open')}function closeLight(e){if(e.target.id==='lightbox'||e.target.className==='x')document.querySelector('#lightbox').classList.remove('open')}document.addEventListener('keydown',e=>{if(e.key==='Escape')document.querySelector('#lightbox')?.classList.remove('open')});
let q=new URLSearchParams(location.search),id=q.get('page');if(id&&pages.find(p=>p.id===id))customer(pages.find(p=>p.id===id));else admin();
</script></body></html>
